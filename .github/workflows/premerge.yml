name: deterministic premerge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-premerge:
    name: deterministic premerge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Record toolchain
        run: |
          python --version
          node --version
          npm --version

      - name: Install JavaScript verification dependencies when present
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run repository premerge registry
        run: python tools/verify.py premerge

      - name: Run TypeScript suite until it is registry-owned
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if python tools/verify.py --list premerge | grep -qx 'typescript-deterministic-suite'; then
            echo "TypeScript suite already executed by the premerge registry."
          else
            npm run verify
          fi
