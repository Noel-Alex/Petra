name: deterministic premerge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-premerge:
    name: deterministic premerge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Record toolchain
        run: |
          python --version
          node --version
          npm --version

      - name: Install JavaScript verification dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic premerge suite
        run: python tools/verify.py premerge
